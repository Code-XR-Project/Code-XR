# Ruff configuration for the Python backend: `npm run lint:python` from the
# repository root (backend/scripts/run-ruff.cjs). The version is pinned in
# backend/requirements-dev.txt.
#
# Lint only. No formatter and no import sorting, on purpose: tests pin import
# lines, quote styles and statement order in src/main.py and elsewhere
# (cleanup skill, section 4), so a reformat would break them for no gain.

# The oldest Python the extension accepts ("Please install Python 3.7+",
# venvManager.ts): syntax newer than this is a lint error, because it would be
# a SyntaxError on a user's machine.
target-version = "py37"

# Fixture corpora are data, not code under maintenance: the metric fixtures
# (manual_test/) are deliberately bad code that test:analysis measures exactly
# as it is, and the dependency fixtures exist to be parsed (an "unused" import
# there is the point). Neither is ever linted, nor "fixed".
extend-exclude = ["manual_test", "tests/fixtures", "tests/metrics_differential/corpus"]

[lint]
# Pyflakes (F: unused imports and variables, undefined names, ...) plus the
# pycodestyle error classes that are bugs rather than style (E4 imports,
# E7 statements, E9 syntax/IO). No style rules: see the header.
#
# Modernization lock-ins (story #56, docs/cleanup/modernization.md): idioms the
# backend no longer contains, kept at zero. E722 bare `except:` (it also catches
# KeyboardInterrupt and SystemExit), UP004 `class X(object)`, UP008
# `super(X, self)`, UP031 `%` formatting, UP032 `.format()` calls.
# FA100 + UP006/UP007/UP045/UP037: annotations use builtin generics and
# `X | None` behind `from __future__ import annotations` (PEP 563, Python 3.7+),
# so they are never evaluated at runtime. A runtime alias such as
# `TargetTuple = Tuple[str, str, str]` is not an annotation and keeps `typing`:
# `tuple[...]` there would be a TypeError before Python 3.9.
# UP012 `.encode("utf-8")`, UP015 `open(path, "r")` and RUF010 `str()` inside an
# f-string: spellings of the default, written out.
select = [
    "E4", "E7", "E9", "F",
    "E722", "UP004", "UP008", "UP031", "UP032",
    "FA100", "UP006", "UP007", "UP037", "UP045",
    "UP012", "UP015", "RUF010",
]

[lint.per-file-ignores]
# E402 (import not at top of file): these modules put their own directory, or
# the backend root, on sys.path before importing their siblings. That bootstrap
# is how the backend runs as loose scripts spawned by the extension, and tests
# pin the import lines and their order (main.py especially), so the imports
# stay where they are.
"scripts/report-manual-metrics.py" = ["E402"]
"src/main.py" = ["E402"]
"src/XR/xr_directory_analysis_coordinator.py" = ["E402"]
"src/XR/xr_file_analysis_coordinator.py" = ["E402"]
"src/export/git_export_analysis_worker.py" = ["E402"]
"src/html/html_dom_parser.py" = ["E402", "FA100"]
"src/livePanels/livePanel_directory_analysis_coordinator.py" = ["E402"]
"src/livePanels/livePanel_directory_deep_analysis_coordinator.py" = ["E402"]
"src/livePanels/livePanel_file_analysis_coordinator.py" = ["E402"]
"src/summaryFiles/file_reanalysis_coordinator.py" = ["E402"]
"src/utils/file_analysis_engine.py" = ["E402"]
# The suites import the code under test (and their sandbox helper) after the
# same sys.path bootstrap.
"tests/manual_metrics_suite.py" = ["E402"]
"tests/dependencies/test_class_owner_inference.py" = ["E402"]
"tests/dependencies/test_dependency_analysis.py" = ["E402"]
"tests/html_dom/test_html_dom_protocol.py" = ["E402"]
"tests/xr_file_analysis/test_empty_file_handling.py" = ["E402"]
"tests/ide_problems/test_function_metrics.py" = ["E402"]
"tests/xr_schema/test_xr_schema.py" = ["E402"]
# FA100: these two keep their `typing` generics. xr_field_schema.py is the XR
# field-schema contract (cleanup skill, section 4: off-limits), and a test pins
# html_dom_parser.py's `def emit_json_result(result: Dict[str, Any]) -> None:`
# line verbatim (livePanelDomIntegration.test.cjs).
"src/utils/xr_field_schema.py" = ["FA100"]
