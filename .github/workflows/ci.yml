name: CI

# The same gates a developer runs locally, on every pull request to master or
# to a release branch (v1.2.1, ...).
# Nothing here is CI-only: if it is green locally it should be green here, and
# the other way round.
#
# The repository is an npm-workspaces monorepo: `npm ci` and the root scripts
# run from the repository root and delegate to apps/vscode-extension; the
# Python backend lives in backend/.
#
# Deliberately absent: secrets, third-party actions, coverage or telemetry
# uploaders, and the browser harnesses (they need Playwright's Chromium and live
# CDNs, so they stay a local, on-demand check).

on:
  pull_request:
    branches:
      - master
      - 'v[0-9]*'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  gate:
    name: npm test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The repo is developed on Windows with a CRLF working tree; ubuntu and
    # macOS are its LF/POSIX runs. All three block: the extension and the
    # future IDE must work on each. (Making the checks *required* for merging
    # is a branch-protection setting on GitHub, which only the maintainer can
    # change.)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # typecheck + lint + compile-tests + unit suites. Needs no webpack build.
      - name: Gate
        run: npm test

  python:
    name: python suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Development tools only (ruff), pinned in backend/requirements-dev.txt.
      # setup-python puts its interpreter first on PATH on every runner OS.
      - name: Install backend dev tools
        run: python -m pip install -r backend/requirements-dev.txt

      # `npm run lint:python`: ruff check with backend/ruff.toml. A missing ruff
      # is a failure, never a skip.
      - name: Lint Python
        run: node backend/scripts/run-ruff.cjs
        env:
          CODEXR_PYTHON: ${{ steps.python.outputs.python-path }}

      # The next runners only use Node builtins, so they need no npm ci. With CI set, a
      # runner that finds no interpreter fails instead of skipping.
      - name: Backend unit suites
        run: node backend/scripts/run-python-tests.cjs
        env:
          CODEXR_PYTHON: ${{ steps.python.outputs.python-path }}

      # `npm run test:analysis`: builds a venv with the lizard version the
      # extension pins for users and measures the per-language fixtures with it.
      - name: Per-language analysis fixtures
        run: node backend/scripts/run-analysis-tests.cjs

      # This suite also loads the compiled LivePanelParser from out/, which the
      # steps above never needed: install and compile the tests first.
      - name: Install
        run: npm ci

      - name: Compile tests
        run: npm run compile-tests

      - name: HTML DOM analysis
        run: node apps/vscode-extension/test/runners/run-html-analysis-tests.cjs

  package:
    name: package the VSIX
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Package
        run: npm run package:vsix

      # The built package against what must and must not ship (the files
      # allowlist is the only control; there is no .vscodeignore). The listing
      # is uploaded so a reviewer can diff two runs.
      - name: Check the VSIX listing
        run: node apps/vscode-extension/scripts/vsix-listing.mjs --out vsix-listing.txt

      # What ships, hashed: reviewers can compare two runs of a cleanup branch.
      - name: Fingerprint dist
        run: node apps/vscode-extension/scripts/dist-fingerprint.mjs --out dist-fingerprint.json

      - name: Upload the VSIX, its fingerprint and its listing
        uses: actions/upload-artifact@v4
        with:
          name: code-xr-vsix
          path: |
            apps/vscode-extension/artifacts/*.vsix
            dist-fingerprint.json
            vsix-listing.txt
          retention-days: 14
          if-no-files-found: error
