<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CodeXR panel placement harness</title>
  <!-- Screens never hide each other or leave the room (#103, PANELS-3/9).
       The real room, the table geometry the registry looks for, the
       multi-screen manager with the default screen and the guide, and the
       common runtime's shared placement for non-screen panels.
       Run: npm run test:xr-panel-placement-harness -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene id="scene" light="defaultLightsEnabled: false" background="color: #10151f" vr-mode-ui="enabled: false">
    <a-entity id="codexrRoom" position="0 0 -10"
      codexr-room="width: 22; depth: 26; height: 11; openSide: south; glassRailing: false;
        wallTexture: ../../templates/components/codexr/xr-room/textures/wall.svg;
        floorTexture: ../../templates/components/codexr/xr-room/textures/floor.svg;
        ceilingTexture: ../../templates/components/codexr/xr-room/textures/ceiling.svg;
        railingTexture: ../../templates/components/codexr/xr-room/textures/railing.svg"></a-entity>
    <a-entity id="codexrScreenManager" codexr-multi-screen-manager="maxScreens: 5; wall: west" position="0 0 0"></a-entity>
    <a-entity light="color: #fff; type: ambient; intensity: 0.85"></a-entity>
    <!-- Stand-in for the analysis table (same id, footprint and anchor). -->
    <a-entity id="codexr-analysis-table-geometry" position="0 0 -18">
      <a-box position="0 0.5 0" width="6.514" height="1" depth="4.118" color="#f1f5f9"></a-box>
    </a-entity>
    <a-entity id="rig" position="0.07 1.75 -10.75">
      <a-entity id="head" camera position="0 0 0" look-controls="enabled: false"></a-entity>
    </a-entity>
  </a-scene>
  <script id="codexr-tooling-config-virtual-screen" type="application/json">{"enabled":true,"broadcastEnabled":false,"collaborationEnabled":false,"signalingPath":"/codexr-broadcast","sceneSelector":"#scene","followAnchorSelector":"#rig","anchoredPosition":{"x":0,"y":4.2,"z":-22},"anchoredRotation":{"x":-12,"y":0,"z":0},"followOffset":{"x":0,"y":0.8,"z":-2.4},"followRotation":{"x":0,"y":0,"z":0}}</script>
  <script id="codexr-tooling-config-guide-screen" type="application/json">{"enabled":true,"collaborationEnabled":false}</script>
  <script src="assembled/virtualScreenRuntime.js"></script>
  <script src="../../templates/components/codexr/virtual-screen/codexrMultiScreenManagerRuntime.js"></script>
  <script src="assembled/guideScreenRuntime.js"></script>
  <script src="../../templates/components/codexr/xr-room/codexrRoomRuntime.js"></script>
  <script src="../../templates/components/common/codexrCommonRuntime.js"></script>
</body>
</html>
