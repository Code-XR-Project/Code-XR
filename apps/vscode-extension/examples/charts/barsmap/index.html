<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bars Map Chart - BabiaXR Example</title>
    <meta name="description" content="A 3D bar map built with the babia-barsmap component: product x quarter, height = sales.">
    <!-- Same library versions as the Code-XR scene templates. -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-babia-components@1.3.4/dist/aframe-babia-components.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene background="color: #cfdbe6">
        <!-- Environment and lights. A light backdrop keeps BabiaXR's axis
             labels (always drawn in black) readable. -->
        <a-entity environment="preset: default; skyType: gradient; skyColor: #cfdbe6; horizonColor: #eef3f7;
                               ground: flat; groundColor: #b9c4ce; groundColor2: #b9c4ce;
                               grid: 1x1; gridColor: #a3afbb; dressing: none; lighting: none; fog: 0"></a-entity>
        <a-light type="ambient" intensity="1"></a-light>
        <a-light type="directional" intensity="1.8" position="-4 10 8"></a-light>

        <!-- Title (a plain a-text: BabiaXR titles ignore titleColor on A-Frame 1.7) -->
        <a-text value="Sales by product and quarter" color="#1b2430" align="center" width="8"
                position="0 6.5 0" rotation="0 36 0"></a-text>

        <!-- Bars map: product x quarter grid, height = sales -->
        <a-entity babia-barsmap='x_axis: product;
                                 z_axis: quarter;
                                 height: sales;
                                 chartHeight: 5;
                                 palette: ubuntu;
                                 legend: true;
                                 axis_name: true;
                                 data: [
                                   {"product": "Laptops", "sales": 1200, "quarter": "Q1"},
                                   {"product": "Phones", "sales": 980, "quarter": "Q1"},
                                   {"product": "Tablets", "sales": 450, "quarter": "Q1"},
                                   {"product": "Laptops", "sales": 1350, "quarter": "Q2"},
                                   {"product": "Phones", "sales": 1100, "quarter": "Q2"},
                                   {"product": "Tablets", "sales": 490, "quarter": "Q2"},
                                   {"product": "Laptops", "sales": 1500, "quarter": "Q3"},
                                   {"product": "Phones", "sales": 1250, "quarter": "Q3"},
                                   {"product": "Tablets", "sales": 575, "quarter": "Q3"}
                                 ]'
                  position="-1.25 0 -1.25"></a-entity>

        <!-- Camera rig: drag to look around, WASD / arrow keys to move.
             Hover over a bar, slice or bubble to see its value. -->
        <a-entity id="rig" movement-controls="fly: true" position="5.2 6.2 7.2" rotation="-25 36 0">
            <a-entity camera position="0 0 0" look-controls></a-entity>
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>
        <a-entity cursor="rayOrigin: mouse"></a-entity>
    </a-scene>
</body>
</html>
