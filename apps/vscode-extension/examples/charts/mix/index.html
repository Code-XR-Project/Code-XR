<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mixed Charts - BabiaXR Example</title>
    <meta name="description" content="Four BabiaXR charts side by side in one scene: bars, pie, bars map and bubbles.">
    <!-- Same library versions as the Code-XR scene templates. -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-babia-components@1.3.4/dist/aframe-babia-components.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene background="color: #cfdbe6">
        <!-- Environment and lights. A light backdrop keeps BabiaXR's axis
             labels (always drawn in black) readable. -->
        <a-entity environment="preset: default; skyType: gradient; skyColor: #cfdbe6; horizonColor: #eef3f7;
                               ground: flat; groundColor: #b9c4ce; groundColor2: #b9c4ce;
                               grid: 1x1; gridColor: #a3afbb; dressing: none; lighting: none; fog: 0"></a-entity>
        <a-light type="ambient" intensity="1"></a-light>
        <a-light type="directional" intensity="1.8" position="-4 10 8"></a-light>

        <!-- Bar chart and its title -->
        <a-text value="Commits per developer" color="#1b2430" align="center" width="7"
                position="-10.5 7.6 0"></a-text>
        <a-entity babia-bars='x_axis: developer;
                              height: commits;
                              chartHeight: 5;
                              palette: ubuntu;
                              legend: true;
                              data: [
                                {"developer": "Ana", "commits": 25},
                                {"developer": "Carlos", "commits": 18},
                                {"developer": "Miguel", "commits": 12},
                                {"developer": "Sofia", "commits": 20}
                              ]'
                  position="-12.4 0 0"></a-entity>

        <!-- Pie chart and its title -->
        <a-text value="Population (millions)" color="#1b2430" align="center" width="7"
                position="-3.5 7.6 0"></a-text>
        <a-entity babia-pie='key: country;
                             size: population;
                             palette: flat;
                             legend: true;
                             data: [
                               {"country": "United States", "population": 329},
                               {"country": "Brazil", "population": 212},
                               {"country": "Mexico", "population": 126},
                               {"country": "Japan", "population": 126}
                             ]'
                  position="-3.5 3.2 0" rotation="90 0 0" scale="1.6 1.6 1.6"></a-entity>

        <!-- Bars map and its title -->
        <a-text value="Sales by product and quarter" color="#1b2430" align="center" width="7"
                position="3.5 7.6 0"></a-text>
        <a-entity babia-barsmap='x_axis: product;
                                 z_axis: quarter;
                                 height: sales;
                                 chartHeight: 5;
                                 palette: ubuntu;
                                 legend: true;
                                 axis_name: true;
                                 data: [
                                   {"product": "Laptops", "sales": 1200, "quarter": "Q1"},
                                   {"product": "Phones", "sales": 980, "quarter": "Q1"},
                                   {"product": "Tablets", "sales": 450, "quarter": "Q1"},
                                   {"product": "Laptops", "sales": 1350, "quarter": "Q2"},
                                   {"product": "Phones", "sales": 1100, "quarter": "Q2"},
                                   {"product": "Tablets", "sales": 490, "quarter": "Q2"},
                                   {"product": "Laptops", "sales": 1500, "quarter": "Q3"},
                                   {"product": "Phones", "sales": 1250, "quarter": "Q3"},
                                   {"product": "Tablets", "sales": 575, "quarter": "Q3"}
                                 ]'
                  position="2.25 0 -1.25"></a-entity>

        <!-- Bubble chart and its title -->
        <a-text value="Commits and reviews" color="#1b2430" align="center" width="7"
                position="10.5 7.6 0"></a-text>
        <a-entity babia-bubbles='x_axis: developer;
                                 z_axis: year;
                                 height: commits;
                                 radius: reviews;
                                 heightMax: 5;
                                 radiusMax: 0.6;
                                 palette: ubuntu;
                                 legend: true;
                                 axis_name: true;
                                 data: [
                                   {"developer": "Ana", "year": "2023", "commits": 60, "reviews": 8},
                                   {"developer": "Ana", "year": "2024", "commits": 19, "reviews": 39},
                                   {"developer": "Ana", "year": "2025", "commits": 22, "reviews": 28},
                                   {"developer": "Carlos", "year": "2023", "commits": 74, "reviews": 18},
                                   {"developer": "Carlos", "year": "2024", "commits": 14, "reviews": 10},
                                   {"developer": "Carlos", "year": "2025", "commits": 65, "reviews": 31},
                                   {"developer": "Sofia", "year": "2023", "commits": 21, "reviews": 40},
                                   {"developer": "Sofia", "year": "2024", "commits": 64, "reviews": 8},
                                   {"developer": "Sofia", "year": "2025", "commits": 82, "reviews": 12}
                                 ]'
                  position="7 0 -4.5"></a-entity>

        <!-- Camera rig: drag to look around, WASD / arrow keys to move.
             Hover over a bar, slice or bubble to see its value. -->
        <a-entity id="rig" movement-controls="fly: true" position="0 4.5 11" rotation="-6 0 0">
            <a-entity camera position="0 0 0" look-controls></a-entity>
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>
        <a-entity cursor="rayOrigin: mouse"></a-entity>
    </a-scene>
</body>
</html>
